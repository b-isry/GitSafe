<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.PageTitle}} · GitSafe</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar-nav">
      <a class="topbar-nav__brand" href="/" aria-label="GitSafe home">
        <svg class="brand__mark" aria-hidden="true" viewBox="0 0 24 24" fill="none" width="28" height="28">
          <path d="M12 2.2 20 5.1v5.3c0 4.9-3.3 8.3-8 10-4.7-1.7-8-5.1-8-10V5.1l8-2.9Z" fill="rgba(63,185,80,0.10)" stroke="rgba(63,185,80,0.85)" stroke-width="1.3" stroke-linejoin="round"></path>
          <g transform="translate(4.2 3.2) scale(0.95)">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" fill="#e6e6ea"></path>
          </g>
          <circle cx="18" cy="17.8" r="3.1" fill="#3fb950" stroke="#161b22" stroke-width="1.2"></circle>
          <path d="M16.7 17.7l.9 1 1.9-2" stroke="#0a0a0b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span class="brand__name">GitSafe</span>
      </a>
      {{if .Cloud.Connected}}
      <div class="conn-pills">
        <div class="conn-pill" id="githubPill">
          <button class="conn-pill__btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="GitHub account actions">
            <span class="conn-pill__dot conn-pill__dot--on" aria-hidden="true"></span>
            <span class="conn-pill__label">@{{.Cloud.Login}}</span>
            <svg class="conn-pill__chevron" width="10" height="10" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="conn-pill__menu" role="menu" aria-label="GitHub account actions">
            <button class="conn-pill__item" type="button" role="menuitem" data-disconnect="github">Disconnect GitHub</button>
          </div>
        </div>
        <div class="conn-pill" id="drivePill">
          <button class="conn-pill__btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Google Drive account actions">
            <span class="conn-pill__dot" id="drivePillDot" aria-hidden="true"></span>
            <span class="conn-pill__label" id="drivePillLabel">Drive…</span>
            <svg class="conn-pill__chevron" width="10" height="10" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="conn-pill__menu" role="menu" aria-label="Google Drive account actions">
            <a class="conn-pill__item" role="menuitem" id="drivePillConnect" href="/api/auth/drive" hidden>Connect Google Drive</a>
            <button class="conn-pill__item" type="button" role="menuitem" id="drivePillDisconnect" data-disconnect="drive" hidden>Disconnect Drive</button>
          </div>
        </div>
      </div>
      {{else}}
      <span class="topbar-nav__version mono">v0.1.0</span>
      {{end}}
    </header>

    <main class="content" id="content">
      {{block "content" .}}{{end}}
    </main>
  </div>
  <script src="/static/cloud.js"></script>
</body>
</html>
