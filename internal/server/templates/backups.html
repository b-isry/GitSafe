{{define "content"}}
<section class="section">
  <div class="panel">
    <div class="panel__head">Backups</div>
    <div class="panel__body panel__body--flush">
      <table class="table table--rows">
        <thead>
          <tr>
            <th>Repository</th>
            <th>Bundle</th>
            <th>Size</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody>
          {{range .BackupRows}}
          <tr class="row-enter">
            <td><span class="mono neutral-strong">{{.Repo}}</span></td>
            <td class="mono neutral-weak">{{.Filename}}</td>
            <td class="mono">{{humanSize .SizeBytes}}</td>
            <td class="mono">{{.Created.Format "2006-01-02 15:04"}}</td>
          </tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </div>
  {{if not .BackupRows}}
  <div class="empty">
    <p class="empty__title">No backups yet</p>
    <p class="empty__body">Bundle files appear here after a backup run.</p>
  </div>
  {{end}}
</section>
{{end}}
