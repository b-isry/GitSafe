name: Feature request
description: Suggest an idea or improvement for GitSafe
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? UI, API or configuration changes?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: cost
    attributes:
      label: Does it fit a $0 free-tier deployment?
      description: GitSafe runs on free tiers (Render free, free PostgreSQL, GitHub Actions).
      options:
        - "Yes"
        - "No / not sure"
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
