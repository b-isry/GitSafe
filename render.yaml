services:
  - type: web
    name: gitsafe
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GITSAFE_BASE_URL
        sync: false
      - key: GITSAFE_GITHUB_CLIENT_ID
        sync: false
      - key: GITSAFE_GITHUB_CLIENT_SECRET
        sync: false
      - key: GITSAFE_DRIVE_CLIENT_ID
        sync: false
      - key: GITSAFE_DRIVE_CLIENT_SECRET
        sync: false
      # Encryption key material for PostgreSQL-backed tokens (required in production).
      # Generate with: openssl rand -hex 32
      - key: GITSAFE_TOKEN_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
