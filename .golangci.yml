# golangci-lint v2 configuration. Kept deliberately small: the "standard"
# linter set (errcheck, govet, ineffassign, staticcheck, unused) plus gofmt.
# Tighten it in focused PRs, fixing the findings as you go.
version: "2"

run:
  timeout: 5m
  build-tags:
    - postgres

linters:
  default: standard
  settings:
    errcheck:
      # Best-effort writes to an http.ResponseWriter and cleanup calls
      # (closing readers, removing temp dirs) have no useful error handling.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - (net/http.ResponseWriter).Write
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        - os.RemoveAll
    staticcheck:
      checks:
        - all
        # User-facing error messages start with product names ("Google
        # Drive ...", "GitHub ...") and are shown verbatim in the UI.
        - -ST1005
        # Style-only checks the codebase does not follow yet (package
        # comments, receiver/identifier naming).
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

formatters:
  enable:
    - gofmt
