outputPath: ./backups
days: 30
cloud:
  enabled: false
  credentialsFile: credentials.json
driveOAuth:
  # Console URL: Google Cloud > APIs & Services > Credentials > OAuth client
  # ID (Web application). The client id is non-secret and can also be set via
  # GITSAFE_DRIVE_CLIENT_ID (env takes precedence). The client secret is
  # always supplied from the environment (GITSAFE_DRIVE_CLIENT_SECRET).
  # redirectUrl is now computed from GITSAFE_BASE_URL (default: http://127.0.0.1:8080)